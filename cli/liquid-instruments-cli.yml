name: MokuCLI
binary: mokucli
summary: 'A first-party command-line utility for managing Moku hardware — device discovery,
  MokuOS updates, instrument bitstream management, feature/plugin deployment, file transfer,
  data streaming, licensing, cloud sign-in, and the offline Moku Compile toolchain. Since API
  4.0.1 MokuCLI is required for all Python and MATLAB API connections, and it is how instrument
  bitstreams are obtained.'
