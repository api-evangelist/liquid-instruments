apis:
- name: Moku REST API
  description: 'The Moku Scripting API is a RESTful HTTP interface served by the Moku
    device itself. A client first POSTs an empty JSON object to moku/claim_ownership
    to mint a Moku-Client-Key, then POSTs JSON parameter objects to
    /api/<instrument-or-group>/<action> for every subsequent operation. Responses are
    a uniform envelope of success, code, messages and data. Because the API server runs
    on the customer''s own hardware, there is no vendor-hosted base URL — the base URL
    is the device''s IP address on the local network (IPv4, or a bracketed IPv6
    link-local address over USB).'
  humanURL: https://apis.liquidinstruments.com/api/
  baseURL: http://{device_ip}/api
  x-base-url-note: 'Device-local API. The published URL form is http://<ip>/api/<instrument>/<action>
    (source: https://apis.liquidinstruments.com/api/getting-started/starting-curl.html).
    There is no vendor-hosted production host for this API; each Moku serves its own.'
  tags:
  - Test and Measurement
  - Instrumentation
  - Device Control
  properties:
