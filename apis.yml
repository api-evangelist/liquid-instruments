- name: Liquid Instruments Identity (OAuth 2.0 / OpenID Connect)
  description: 'The hosted identity service behind mokucli login, Moku Cloud Compile and
    licensed feature access. It publishes a full OpenID Connect discovery document at
    https://auth.liquidinstruments.com/.well-known/openid-configuration, advertising the
    authorization, token, userinfo, device-authorization, logout and JWKS endpoints, the
    authorization_code / client_credentials / refresh_token / password / implicit /
    device_code grant types, and the openid, offline_access, email, phone and profile
    scopes. mokucli signs in with the authorization code flow plus PKCE (S256) and then
    mints a short-lived Security Token Service credential that is cached locally.'
  humanURL: https://apis.liquidinstruments.com/cli/login.html
  baseURL: https://auth.liquidinstruments.com
