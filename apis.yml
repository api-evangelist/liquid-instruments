aid: liquid-instruments
name: Liquid Instruments
description: 'Liquid Instruments builds Moku, a family of software-defined, FPGA-reconfigurable
  test-and-measurement hardware platforms (Moku:Go, Moku:Lab, Moku:Pro, Moku:Delta)
  that replace a bench of traditional instruments — oscilloscope, spectrum analyzer,
  waveform generator, lock-in amplifier, PID controller, phasemeter, laser lock box,
  logic analyzer, FIR/digital filter box, frequency response analyzer and more — with
  one reconfigurable device. Every Moku exposes a RESTful HTTP control API served by
  the device itself on the local network, wrapped by first-party Python, MATLAB and
  LabVIEW client libraries plus the MokuCLI command-line utility, and the company
  runs a hosted OpenID Connect identity service for Moku Cloud Compile and licensed
  feature access. The company was founded out of gravitational-wave detection research
  and is headquartered in San Diego, California with offices in Canberra and Melbourne,
  Australia.'
