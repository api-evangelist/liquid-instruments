  composition: A device runs one instrument at a time, or up to 4 (Moku:Pro / Moku:Lab 3-slot) or 5 (Moku:Delta)
    instruments simultaneously in Multi-instrument Mode, where each instrument occupies a numbered slot
    and is addressed at /api/slot<N>/<group>/<action>.
